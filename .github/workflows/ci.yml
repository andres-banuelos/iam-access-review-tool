name: CI — Lint, Type Check & Unit Tests

on:
  push:
    branches: [main, develop, feat/professional-grade-improvements]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy main.py src tests

      - name: Unit tests
        env:
          AZURE_TENANT_ID: "dummy-tenant"
          AZURE_CLIENT_ID: "dummy-client"
          AZURE_CLIENT_SECRET: "dummy-secret"
        run: pytest -v
